name: Repository checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check commit identities
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess
          identities = subprocess.check_output(['git', 'log', '--all', '--format=%ae%n%ce']).lower().splitlines()
          identities += subprocess.check_output(['git', 'for-each-ref', '--format=%(taggeremail)', 'refs/tags']).lower().replace(b'<', b'').replace(b'>', b'').splitlines()
          if any(value and not (value.endswith(b'@users.noreply.github.com') or value == b'noreply@github.com') for value in identities):
              raise SystemExit('Commit identity check failed.')
          print('Commit identity check passed.')
          PY
      - name: Check repository history
        shell: bash
        run: |
          set -euo pipefail
          version=8.30.1
          scanner_dir="$(mktemp -d)"
          cd "$scanner_dir"
          archive="gitleaks_${version}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          curl --fail --silent --show-error --location "$base/$archive" -o "$archive"
          curl --fail --silent --show-error --location "$base/gitleaks_${version}_checksums.txt" -o checksums.txt
          grep "  $archive$" checksums.txt | sha256sum --check --strict -
          tar -xzf "$archive" gitleaks
          cd "$GITHUB_WORKSPACE"
          "$scanner_dir/gitleaks" git . --log-opts="--all --full-history --root -m" --redact --ignore-gitleaks-allow --no-banner
